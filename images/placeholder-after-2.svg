<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="AFTER placeholder headlight image">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f36"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="clearGrad" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="0.45" stop-color="#9dbfe6"/>
      <stop offset="1" stop-color="#22354d"/>
    </radialGradient>
    <radialGradient id="hazeGrad" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f1e2a8"/>
      <stop offset="0.5" stop-color="#c9a94f"/>
      <stop offset="1" stop-color="#5a4a1e"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="lens"><path d="M300 400 C300 260 420 190 640 190 C820 190 960 250 960 330 C960 470 800 610 620 610 C420 610 300 540 300 400 Z"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="url(#paint)"/>
  <!-- bonnet line and bumper -->
  <path d="M0 150 Q600 90 1200 170 L1200 0 L0 0 Z" fill="#0b0f14" opacity="0.55"/>
  <path d="M0 640 Q600 690 1200 640 L1200 800 L0 800 Z" fill="#0b0f14" opacity="0.6"/>
  <!-- headlight housing -->
  <path d="M280 400 C280 245 415 170 640 170 C835 170 985 240 985 330 C985 485 810 635 620 635 C410 635 280 555 280 400 Z" fill="#05070a"/>
  <!-- lens -->
  <g clip-path="url(#lens)">
    <rect x="280" y="170" width="720" height="480" fill="url(#clearGrad)"/>
    <!-- projector -->
    <circle cx="520" cy="400" r="120" fill="none" stroke="rgba(230,240,255,0.9)" stroke-width="10"/>
    <circle cx="520" cy="400" r="78" fill="#0f1a2a" stroke="rgba(230,240,255,0.9)" stroke-width="6"/>
    <circle cx="520" cy="400" r="34" fill="#e9f2ff"/>
    <!-- DRL strip -->
    <path d="M330 300 C420 230 640 215 900 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <!-- indicator -->
    <ellipse cx="790" cy="450" rx="110" ry="60" fill="#1e2a3b" stroke="rgba(230,240,255,0.9)" stroke-width="6"/>
    <ellipse cx="520" cy="320" rx="150" ry="60" fill="white" opacity="0.28" transform="rotate(-18 520 320)"/>
       <ellipse cx="760" cy="470" rx="90" ry="30" fill="#cfe4ff" opacity="0.25" transform="rotate(-18 760 470)"/>
  </g>
  <!-- glass edge highlight -->
  <path d="M300 400 C300 260 420 190 640 190 C820 190 960 250 960 330" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <g transform="translate(60 720)">
    <text font-family="Inter, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.55)">Placeholder image 2 — replace with a real photo (see images/README.md)</text>
  </g>
</svg>